name: Android 2.0.2 native glass UI and emulator acceptance
on:
  push:
    branches: [main]
    paths: ['apps/android/**', 'scripts/*android*', '.github/workflows/android-design.yml', 'packages/localization/**', 'packages/engine/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-design-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned SDK and NDK
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
      - name: Restore private persistent Android signing identity when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.RADVPN_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RADVPN_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RADVPN_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RADVPN_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/radvpn-signing.jks"
            echo "RADVPN_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/radvpn-signing.jks" >> "$GITHUB_ENV"
            echo "RADVPN_ANDROID_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RADVPN_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RADVPN_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Build real native APK, test APK, notices and lint
        run: |
          set -euo pipefail
          mkdir -p dist/android
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          python3 scripts/check.py
          bash scripts/build-android.sh 2>&1 | tee dist/android/build.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs apps/android/app/build/outputs/apk/debug/app-debug.apk | tee dist/android/signature.txt
          python3 -c 'import json,os;json.dump({"persistent_key": bool(os.environ.get("RADVPN_ANDROID_KEYSTORE_PATH"))},open("dist/android/signing-policy.json","w"))'
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk dist/android/RADVPN-Android.apk
          cp apps/android/app/build/outputs/apk/debug/output-metadata.json dist/android/metadata.json
          (cd dist/android && sha256sum *.apk > SHA256SUMS.txt)
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run installed native APK on API35 emulator, two phone sizes and both languages
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash scripts/test-android-native.sh
      - name: Upload APK and actual emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RADVPN-Android-native-design
          overwrite: true
          path: |
            dist/android/
            apps/android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - name: Publish credential-free emulator captures for design review, not a release
        if: always()
        env:
          EVIDENCE_BRANCH: android-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/publish-android-evidence.sh
