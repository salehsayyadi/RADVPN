name: RADVPN 3.0.3 candidate validation (no publication)
on:
  push:
    branches: [feature/radvpn-3.0.3]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radvpn303-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '1.27.3'}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {dotnet-version: '8.0.427'}
      - name: Prepare actual Windows native display and compiler
        shell: pwsh
        run: |
          ./scripts/prepare-windows-display.ps1
          choco install nsis --version=3.12 -y --no-progress
      - name: Validate locales and core
        shell: pwsh
        run: |
          python scripts/check.py
          if ($LASTEXITCODE -ne 0) { throw 'Version/locale validation failed' }
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed' }
      - name: Build candidate installer and portable
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Actual previous-release to candidate upgrade
        shell: pwsh
        run: ./scripts/test-upgrade-303.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: RADVPN-3.0.3-Windows-candidate
          path: |
            dist/RADVPN-Setup-3.0.3-x64.exe
            dist/RADVPN-Windows-Portable-3.0.3-x64.zip
            dist/SHA256SUMS.txt
            dist/upgrade-303-report.txt
            dist/native-tests-303.json
            dist/upgrade-ui/**
          if-no-files-found: warn
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '1.27.3'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Install SDK and NDK
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
      - name: Restore existing signing identity only when fully configured
        env:
          KEYSTORE_BASE64: ${{ secrets.RADVPN_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RADVPN_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RADVPN_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RADVPN_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/original-radvpn.jks"
            echo "RADVPN_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/original-radvpn.jks" >> "$GITHUB_ENV"
            echo "RADVPN_ANDROID_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RADVPN_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RADVPN_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'RADVPN_SIGNING_CONFIGURED=true' >> "$GITHUB_ENV"
          else
            echo 'RADVPN_SIGNING_CONFIGURED=false' >> "$GITHUB_ENV"
            echo 'BLOCKED: original signing identity not configured; compile only, no new key or APK.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build real engine and compile Kotlin without generating any signing key
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          export PATH="$(go env GOPATH)/bin:$PATH"
          VERSION=$(cat scripts/gomobile-version.txt)
          go install "golang.org/x/mobile/cmd/gomobile@$VERSION"
          go install "golang.org/x/mobile/cmd/gobind@$VERSION"
          mkdir -p apps/android/app/libs
          gomobile bind -ldflags='-checklinkname=0 -s -w' -target=android/arm64,android/amd64 -androidapi=26 -o apps/android/app/libs/radengine.aar ./packages/mobile
          python3 scripts/collect-android-licenses.py
          gradle -p apps/android --no-daemon compileDebugKotlin lintDebug
      - name: Build debug instrumentation only (not a production signing substitute)
        run: gradle -p apps/android --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable disposable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installed login gate and Keystore on two phone sizes
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash scripts/test-android-account-gate.sh
      - name: Build only with the existing configured identity
        if: env.RADVPN_SIGNING_CONFIGURED == 'true'
        run: gradle -p apps/android --no-daemon assembleRelease
      - name: Check actual previous APK signing continuity
        if: env.RADVPN_SIGNING_CONFIGURED == 'true'
        run: |
          curl -fL https://github.com/salehsayyadi/RADVPN/releases/download/v2.0.3/RADVPN-Android.apk -o "$RUNNER_TEMP/previous.apk"
          python3 scripts/check-android-upgrade-303.py "$RUNNER_TEMP/previous.apk" apps/android/app/build/outputs/apk/release/app-release.apk "$ANDROID_HOME/build-tools/35.0.0"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: RADVPN-3.0.3-Android-candidate-evidence
          path: |
            apps/android/app/build/outputs/apk/release/app-release.apk
            apps/android/app/build/reports/lint-results-debug.html
            dist/android-upgrade-303-report.txt
            dist/android/account-gate/**
          if-no-files-found: warn
# This workflow has read-only repository permissions and cannot publish a release.
