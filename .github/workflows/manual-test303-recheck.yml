name: Recheck existing manual-test APK first launch
on:
  push:
    branches: [feature/radvpn-3.0.3]
    paths: [.github/manual-test303-recheck-request.json]
permissions:
  contents: read
  actions: read
jobs:
  recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Download exact previously built test APK with verified artifact digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess,json,hashlib,zipfile,io,pathlib
          base='repos/salehsayyadi/RADVPN/'
          a=next(a for a in json.loads(subprocess.check_output(['gh','api',base+'actions/runs/41069345424/artifacts']))['artifacts'] if a['name']=='RADVPN-303-Android-manual-test')
          data=subprocess.check_output(['gh','api',base+f'actions/artifacts/{a["id"]}/zip']);assert a['digest']=='sha256:'+hashlib.sha256(data).hexdigest()
          p=pathlib.Path('dist/manual-android');p.mkdir(parents=True)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
           for name in ['RADVPN-Android-3.0.3-MANUAL-TEST.apk','ANDROID-MANUAL-PROVENANCE.json','ANDROID-TEST-README.txt']:
            found=[i for i in z.infolist() if i.filename==name or i.filename.endswith('/'+name)];assert len(found)==1
            (p/name).write_bytes(z.read(found[0]))
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Recheck exact APK using staged assertions; no capture bypass
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: python3 scripts/test-manual-android303-diagnostic.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: manual-test-recheck
          path: dist/manual-android/ANDROID-MANUAL-INSTALL-REPORT.json
  record:
    needs: recheck
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Record bounded install report only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess,json,hashlib,zipfile,io,base64,os
          base='repos/salehsayyadi/RADVPN/'
          def api(path,method='GET',body=None):
           args=['gh','api','--method',method,base+path]
           if body is not None:args+=['--input','-']
           return subprocess.check_output(args,input=json.dumps(body).encode() if body is not None else None)
          a=next(a for a in json.loads(api('actions/runs/'+os.environ['GITHUB_RUN_ID']+'/artifacts'))['artifacts'] if a['name']=='manual-test-recheck')
          data=api(f'actions/artifacts/{a["id"]}/zip');assert a['digest']=='sha256:'+hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
           f=next(i for i in z.infolist() if i.filename.endswith('ANDROID-MANUAL-INSTALL-REPORT.json'));assert f.file_size<20000
           content=z.read(f)
          path='contents/docs/manual-test303/recheck.json'
          payload=dict(message='docs: record APK first-launch recheck',branch='feature/radvpn-3.0.3',content=base64.b64encode(content).decode())
          try:payload['sha']=json.loads(api(path+'?ref=feature/radvpn-3.0.3'))['sha']
          except subprocess.CalledProcessError:pass
          api(path,'PUT',payload)
          PY
