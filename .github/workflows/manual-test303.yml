name: RADVPN 3.0.3 user-requested manual-test prerelease
on:
  push:
    branches: [feature/radvpn-3.0.3]
    paths: [.github/manual-test303-request.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radvpn303-manual-test-publication
  cancel-in-progress: false
jobs:
  build-android-manual:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '1.27.3'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Build separate-identity manual-test APK; no production signer or secrets
        run: |
          set -Eeuo pipefail
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          export PATH="$(go env GOPATH)/bin:$PATH"
          VERSION=$(cat scripts/gomobile-version.txt)
          go install "golang.org/x/mobile/cmd/gomobile@$VERSION"
          go install "golang.org/x/mobile/cmd/gobind@$VERSION"
          mkdir -p apps/android/app/libs dist/manual-android
          gomobile bind -ldflags='-checklinkname=0 -s -w' -target=android/arm64,android/amd64 -androidapi=26 -o apps/android/app/libs/radengine.aar ./packages/mobile
          python3 scripts/collect-android-licenses.py
          python3 scripts/check.py
          gradle -p apps/android --no-daemon assembleSandbox assembleSandboxAndroidTest lintSandbox
          cp apps/android/app/build/outputs/apk/sandbox/app-sandbox.apk dist/manual-android/RADVPN-Android-3.0.3-MANUAL-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/manual-android/*.apk > "$RUNNER_TEMP/manual-signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/manual-android/*.apk > "$RUNNER_TEMP/manual-package.txt"
          python3 - <<'PY'
          import json,hashlib,pathlib,os,re
          p=pathlib.Path('dist/manual-android');apk=p/'RADVPN-Android-3.0.3-MANUAL-TEST.apk'
          package=(pathlib.Path(os.environ['RUNNER_TEMP'])/'manual-package.txt').read_text()
          assert "package: name='app.radvpn.testing'" in package and "versionName='3.0.3-testing'" in package
          assert "application-label:'RADVPN Test 3.0.3'" in package
          cert=re.search(r'Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]+)',(pathlib.Path(os.environ['RUNNER_TEMP'])/'manual-signature.txt').read_text()).group(1)
          (p/'ANDROID-MANUAL-PROVENANCE.json').write_text(json.dumps(dict(source_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],package='app.radvpn.testing',version='3.0.3-testing',sha256=hashlib.sha256(apk.read_bytes()).hexdigest(),signer_sha256=cert,production_signing_compatible=False,test_signing_persistence_guaranteed=False,abis=['arm64-v8a','x86_64']),indent=2)+'\n')
          (p/'ANDROID-TEST-README.txt').write_text('MANUAL TEST ONLY. Package app.radvpn.testing; label RADVPN Test 3.0.3. Install alongside app.radvpn, separate data. NOT an in-place production update. Test-only signer, may change between runs. Do not uninstall your production app. Login requires a separately deployed valid-HTTPS central API and configured bot tenant/panel; publication does not install them. No live payment, VPN or production upgrade acceptance is claimed.\n')
          PY
      - name: Enable disposable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install alongside production baseline and check login-first
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash scripts/verify-manual-native303.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: RADVPN-303-Android-manual-test
          path: dist/manual-android/
          if-no-files-found: error
  publish-manual-test:
    needs: build-android-manual
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Verify artifacts and publish prerelease only; record bounded status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-manual-test303.py
