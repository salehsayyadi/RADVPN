name: Build install-test and publish standalone Android 3.0.3 testing APK
on:
  push:
    branches: [feature/radvpn-3.0.3]
    paths: [.github/android-testing303-approval.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radvpn303-standalone-android
  cancel-in-progress: false
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '1.27.3'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Build separate-identity testing APK; no production signing secrets
        run: |
          set -Eeuo pipefail
          exec > >(tee "$RUNNER_TEMP/android-standalone-build.log") 2>&1
          trap 'python3 scripts/annotate-android-test-failure.py "$RUNNER_TEMP/android-standalone-build.log"' ERR
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          gradle -p apps/android --no-daemon help
          export PATH="$(go env GOPATH)/bin:$PATH"
          VERSION=$(cat scripts/gomobile-version.txt)
          go install "golang.org/x/mobile/cmd/gomobile@$VERSION"
          go install "golang.org/x/mobile/cmd/gobind@$VERSION"
          mkdir -p apps/android/app/libs dist/android-testing
          gomobile bind -ldflags='-checklinkname=0 -s -w' -target=android/arm64,android/amd64 -androidapi=26 -o apps/android/app/libs/radengine.aar ./packages/mobile
          python3 scripts/collect-android-licenses.py
          python3 scripts/check.py
          gradle -p apps/android --no-daemon assembleSandbox lintSandbox
          cp apps/android/app/build/outputs/apk/sandbox/app-sandbox.apk dist/android-testing/RADVPN-Android-3.0.3-TEST-standalone.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/android-testing/*.apk > dist/android-testing/test-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/android-testing/*.apk > dist/android-testing/test-package.txt
          python3 - <<'PY'
          import json,hashlib,pathlib,os,re
          p=pathlib.Path('dist/android-testing');apk=p/'RADVPN-Android-3.0.3-TEST-standalone.apk'
          package=(p/'test-package.txt').read_text();assert "package: name='app.radvpn.testing'" in package and "versionName='3.0.3-testing'" in package
          assert "application-label:'RADVPN Test 3.0.3'" in package
          digest=hashlib.sha256(apk.read_bytes()).hexdigest();(p/'ANDROID-TEST-SHA256SUMS.txt').write_text(digest+'  '+apk.name+'\n')
          cert=re.search(r'Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]+)',(p/'test-signature.txt').read_text()).group(1)
          (p/'ANDROID-TEST-PROVENANCE.json').write_text(json.dumps(dict(source_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],package='app.radvpn.testing',version='3.0.3-testing',sha256=digest,signer_sha256=cert,production_signing_compatible=False,test_signing_persistence_guaranteed=False,abis=['arm64-v8a','x86_64']),indent=2)+'\n')
          (p/'ANDROID-TEST-README.txt').write_text('RADVPN 3.0.3 STANDALONE TEST APK\nPackage: app.radvpn.testing; label RADVPN Test 3.0.3.\nInstalls alongside the production app; no uninstall is needed. Separate settings/data. Test-only debug signer, NOT the original production identity and NOT a compatible production upgrade. Future test builds may have a different test signer.\nAndroid 8+; arm64-v8a and x86_64.\nManual VPN configuration can be tested. RADVPN account login additionally requires the independently deployed central HTTPS API and a configured Telegram bot; publishing this APK does not deploy them.\nNo claim of original-key upgrade, remote VPN safety or live account/payment E2E.\n')
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual install alongside baseline and account-screen launch
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: python3 scripts/test-android-standalone303.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: RADVPN-303-Android-standalone-test
          path: dist/android-testing/
          if-no-files-found: error
  publish-testing-apk:
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Attach only the install-tested standalone APK; keep Windows assets and Latest unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-android-standalone303.py
