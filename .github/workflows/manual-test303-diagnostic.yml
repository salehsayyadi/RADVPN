name: Diagnose manual-test install failure (bounded metadata only)
on:
  push:
    branches: [feature/radvpn-3.0.3]
    paths: [.github/manual-test303-diagnostic-request.json]
permissions:
  contents: write
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Record job step conclusions and the generated install report only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess,json,zipfile,io,base64,hashlib
          repo='salehsayyadi/RADVPN';run=41076266957
          def api(path,method='GET',body=None):
           cmd=['gh','api','--method',method,'repos/'+repo+'/'+path]
           if body is not None:cmd+=['--input','-']
           return subprocess.check_output(cmd,input=json.dumps(body).encode() if body is not None else None)
          jobs=json.loads(api(f'actions/runs/{run}/jobs'))['jobs']
          report={'run_id':run,'jobs':[dict(name=j['name'],conclusion=j['conclusion'],steps=[dict(name=s['name'],conclusion=s['conclusion']) for s in j['steps']]) for j in jobs]}
          artifact=next(a for a in json.loads(api(f'actions/runs/{run}/artifacts'))['artifacts'] if a['name']=='RADVPN-303-Android-manual-test')
          data=api(f'actions/artifacts/{artifact["id"]}/zip');assert artifact['digest']=='sha256:'+hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
           for name in ['ANDROID-MANUAL-INSTALL-REPORT.json','ANDROID-MANUAL-PROVENANCE.json','native-mask-instrumentation.txt']:
            found=[i for i in z.infolist() if i.filename==name or i.filename.endswith('/'+name)]
            if found:
             assert len(found)==1 and found[0].file_size<20000;report[name]=z.read(found[0]).decode() if name.endswith('.txt') else json.loads(z.read(found[0]))
          p='contents/docs/manual-test303/diagnostic.json'
          payload=dict(message='docs: record bounded manual-test failure diagnosis',content=base64.b64encode((json.dumps(report,indent=2)+'\n').encode()).decode(),branch='feature/radvpn-3.0.3')
          try:payload['sha']=json.loads(api(p+'?ref=feature/radvpn-3.0.3'))['sha']
          except subprocess.CalledProcessError:pass
          api(p,'PUT',payload)
          PY
