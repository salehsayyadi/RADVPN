name: RADVPN testing builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
      - name: Format, schema, locale and metadata checks
        run: |
          test -z "$(gofmt -l packages cmd)"
          python3 scripts/check.py
          go vet ./...
          go mod verify
      - name: Unit and real local proxy integration tests
        run: go test -race -count=1 -v ./...
      - name: Bounded parser fuzz smoke test
        run: go test ./packages/engine -run '^$' -fuzz FuzzImport -fuzztime 20s -parallel 2
  windows:
    runs-on: windows-latest
    needs: shared
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Core tests on Windows
        run: go test -count=1 ./...
      - name: Verify desktop formatting
        shell: pwsh
        run: |
          dotnet restore apps/windows/RADVPN.csproj
          dotnet format whitespace apps/windows/RADVPN.csproj --verify-no-changes --no-restore
      - name: Build portable testing package and validate Wintun signature
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Desktop process smoke test (not VPN/visual QA)
        shell: pwsh
        run: |
          $p = Start-Process dist/windows/RADVPN.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw 'Desktop exited unexpectedly' }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RADVPN-2.0.0-windows-x64-testing
          path: dist/RADVPN-2.0.0-windows-x64-testing.zip
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install exact SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
      - name: Build native engine, debug APK and Android lint
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          bash scripts/build-android.sh
      - name: Check debug APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose apps/android/app/build/outputs/apk/debug/app-debug.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RADVPN-2.0.0-android-debug-testing
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
# No automatic public release. Device acceptance, remote server QA, license
# review and final artifact verification are mandatory before v2.0.0 tagging.
