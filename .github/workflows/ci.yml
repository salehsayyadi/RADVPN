name: RADVPN native builds and installer acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
      - name: Format, schema, locale, vet and module verification
        run: |
          test -z "$(gofmt -l packages cmd)"
          python3 scripts/check.py
          go vet ./...
          go mod verify
      - name: Race tests and real local proxy integration
        run: go test -race -count=1 -v ./...
      - name: Bounded parser fuzz smoke
        run: go test ./packages/engine -run '^$' -fuzz FuzzImport -fuzztime 20s -parallel 2
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.427'
      - name: Configure runner display for actual native window sizes
        shell: pwsh
        run: ./scripts/prepare-windows-display.ps1
      - name: Install pinned NSIS compiler
        run: choco install nsis --version=3.12 -y --no-progress
      - name: Core tests and desktop formatting
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory -Force | Out-Null
          go test -count=1 -v ./... *> dist/windows-core-tests.txt
          if ($LASTEXITCODE -ne 0) { Get-Content dist/windows-core-tests.txt; throw 'Core tests failed' }
          python scripts/materialize-assets.py
          dotnet restore apps/windows/RADVPN.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
          dotnet format whitespace apps/windows/RADVPN.csproj --verify-no-changes --no-restore *> dist/format-check.txt
          if ($LASTEXITCODE -ne 0) { Get-Content dist/format-check.txt; throw 'Formatting failed' }
      - name: Build self-contained installer and verify vendor driver signature
        shell: pwsh
        run: ./scripts/build-windows.ps1 *>&1 | Tee-Object -FilePath dist/windows-build.txt
      - name: Upload installer and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RADVPN-2.0.2-windows-x64-installer
          path: |
            dist/RADVPN-Setup-2.0.2-x64.exe
            dist/RADVPN-Windows-Portable-2.0.2-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Install, launch, capture actual WPF UI, repair and uninstall
        shell: pwsh
        timeout-minutes: 8
        run: ./scripts/test-windows-installer.ps1 *>&1 | Tee-Object -FilePath dist/windows-acceptance.txt
      - name: Capture compiled native UI for diagnosis if packaging fails
        if: failure()
        shell: pwsh
        timeout-minutes: 3
        run: |
          if (Test-Path dist/windows/RADVPN.exe) {
            $p = Start-Process dist/windows/RADVPN.exe -ArgumentList "--ui-smoke --capture-dir `"$PWD/dist/ui-evidence`"" -PassThru -Wait
            "Native diagnostic UI exit: $($p.ExitCode)" | Set-Content dist/windows-ui-diagnostic.txt
          }
      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RADVPN-native-evidence
          path: |
            dist/ui-evidence/
            dist/*tests*.json
            dist/*report*.txt
            dist/windows-*.txt
            dist/format-check.txt
          if-no-files-found: warn
      - name: Publish public empty-state UI evidence for review, not a release
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          EVIDENCE_BRANCH: ui-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/publish-evidence.sh
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install exact SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
      - name: Restore private persistent Android signing identity when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.RADVPN_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RADVPN_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RADVPN_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RADVPN_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/radvpn-signing.jks"
            echo "RADVPN_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/radvpn-signing.jks" >> "$GITHUB_ENV"
            echo "RADVPN_ANDROID_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RADVPN_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RADVPN_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Build native engine, debug APK and Android lint
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          bash scripts/build-android.sh
      - name: Check debug APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose apps/android/app/build/outputs/apk/debug/app-debug.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RADVPN-2.0.2-android-debug-testing
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
# Publication is separate and requires review of actual successful native evidence.
